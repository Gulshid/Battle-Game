name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub get
      - run: dart run melos bootstrap
      - run: dart format --set-exit-if-changed .
      - run: dart run melos run arch
      - run: dart run melos run data:check
      - run: dart run melos run analyze
      - run: dart run melos run test
      - run: dart run melos run test:client
  build-apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub get
      - run: cd apps/game_client && flutter build apk --debug --dart-define-from-file=config/dev.json
